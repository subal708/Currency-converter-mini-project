<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- add favicon icon -->
    <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="curreccy_style.css">
    <link rel="stylesheet" href="responsive-Curr-Con.css">
</head>

<body>
    <!-- main container -->
    <div class="container">
        <h1>Currency Converter</h1>
        <!-- enter amount and select currency -->
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value="1" type="number">
            </div>
            <!-- select currency -->
            <div class="dropdown">
                <!-- from currency -->
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png">
                        <select name="from">
                            <option value="USD">USD</option>
                            <!-- <option value="USD">USD</option>
                            <option value="INR">INR</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option> -->
                        </select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left" id="arrowReverse"></i>
                <!-- to cuttency -->
                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png">
                        <select name="to">
                            <option value="INR">INR</option>
                            <!-- <option value="USD">USD</option>
                            <option value="INR" selected>INR</option>
                            <option value="EUR">EUR</option>
                            <option value="AUD">AUD</option> -->
                        </select>
                    </div>
                </div>
            </div>
            <!-- final message -->
            <div class="msg">Click on "Get Exchange"</div>
            <!-- exchange button -->
            <button>Get Exchange</button>
        </form>
    </div>
    <script src="code.js"></script>
    <script src="currency_js.js"></script>
</body>

</html>
